# 不同等级锁的小游戏配置：以数字作为等级键，键越大难度越高；name 为该等级的名称
# 等级 0：定义时覆盖默认配置（config.yml 的 game 小节）；未定义时等级 0 使用默认配置
# 未在此处配置的正等级将按就近原则回退：更低可用等级 → 更高可用等级 → 默认配置
# 新增等级：复制一份配置并将键改为更大的数字即可
# game-type：该等级使用的小游戏类型（moving-bar = 移动游标 / rhythm-bar = 节奏条 / tumbler-bar = 机关转轮），公共参数见 config.yml 的 game 小节
# 等级划分（功能覆盖）：0-4 为 moving-bar（游标进入未完成判定区点击），5-7 为 rhythm-bar（依次命中多个判定点），8-9 为 tumbler-bar（调 A 转 B）
# 渲染：ascii 无需材质包 / bitmap 需安装材质包；控制：oscillate=true 自动往复 / false 骑乘模式（A/D 键移动游标）
# 难度：条长越长、判定区越短、move-interval 越小、判定点越多 → 越难
0:
  name: default     # 最简单：宽判定区，慢速
  game-type: moving-bar
  oscillate: true
  render-mode: ascii
  bar-length: 15
  unhit-length: 3
  move-interval: 10
  timeout: 15
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
1:
  name: novice      # 新手：判定区收窄
  game-type: moving-bar
  oscillate: true
  render-mode: ascii
  bar-length: 15
  unhit-length: 2
  move-interval: 10
  timeout: 15
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
2:
  name: advanced    # 进阶：条更长 + 提速
  game-type: moving-bar
  oscillate: true
  render-mode: ascii
  bar-length: 20
  unhit-length: 2
  move-interval: 8
  timeout: 18
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
3:
  name: master      # 大师：bitmap 位图 + 高速（需材质包）
  game-type: moving-bar
  oscillate: true
  render-mode: bitmap
  bar-length: 25
  unhit-length: 2
  move-interval: 5
  timeout: 20
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
4:
  name: ride        # 骑乘：A/D 键手动控制游标（moving-bar）
  game-type: moving-bar
  oscillate: false
  render-mode: ascii
  bar-length: 20
  unhit-length: 3
  move-interval: 6
  timeout: 25
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
5:
  name: rhythm      # 节奏新手：3 个判定点，ascii
  game-type: rhythm-bar
  oscillate: true
  render-mode: ascii
  bar-length: 20
  hit-count: 3      # 判定点数量
  hit-length: 2     # 每个判定点长度（格数）
  hit-min-gap: 3    # 判定点之间的最小间隔（格数）
  move-interval: 8
  timeout: 20
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
6:
  name: rhythm-master # 节奏大师：bitmap 位图 + 4 个判定点（需材质包）
  game-type: rhythm-bar
  oscillate: true
  render-mode: bitmap
  bar-length: 25
  hit-count: 4
  hit-length: 2
  hit-min-gap: 3
  move-interval: 6
  timeout: 25
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
7:
  name: rhythm-ride # 节奏骑乘：A/D 键手动控制游标（rhythm-bar）
  game-type: rhythm-bar
  oscillate: false
  render-mode: ascii
  bar-length: 20
  hit-count: 3
  hit-length: 2
  hit-min-gap: 3
  move-interval: 6
  timeout: 25
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
8:
  name: tumbler    # 机关转轮：A/D 调 A、W 转 B，A 对准可解锁状态才能开锁
  game-type: tumbler-bar
  render-mode: ascii   # 测试可改 bitmap（需安装新材质包）
  a-states: 5          # 机关 A 状态数（每个状态另有对应特殊态）
  initial-a: 0         # 尝试失败复位后 A 的初始状态
  unlock-a: 1          # 可解锁的 A 状态（仅 A 在此状态时 B 能转到最终状态）
  b-states: 5          # 机关 B 状态数（0~4）
  b-final: 4           # B 最终状态（达到即成功）
  a-offset: 224           # A 在背景内的水平位置（px，居中 224；垂直位置由资源包 ascent 固定为上部）
  b-offset: 224           # B 在背景内的水平位置（px，居中 224；垂直位置由资源包 ascent 固定为下部）
  background-length: 15   # 背景总格数（每格 = 32px；背景为一张 480x96 完整大图）
  tumbler-width: 3        # 机关 A/B 状态图宽度（格，仅 ascii 模式显示宽度；bitmap 模式图标固定 32px）
  max-attempts: 3      # 最大尝试数（超限判撬锁失败）
  move-interval: 6     # A/D 调 A 的步进间隔（tick）
  timeout: 30
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
9:
  name: tumbler-bitmap # 机关转轮位图：96x96 背景整图 + A/B 透明图标重叠定位（需材质包）
  game-type: tumbler-bar
  render-mode: bitmap
  a-states: 5          # 机关 A 状态数（每个状态另有对应特殊态）
  initial-a: 0         # 尝试失败复位后 A 的初始状态
  unlock-a: 1          # 可解锁的 A 状态（仅 A 在此状态时 B 能转到最终状态）
  b-states: 5          # 机关 B 状态数（0~4）
  b-final: 4           # B 最终状态（达到即成功）
  a-offset: 24         # A 左上角相对背景左端的水平位置（px；24 = (96-48)/2 与 B 同位居中；垂直位置由 PNG 内留白固定为上部）
  b-offset: 24         # B 左上角相对背景左端的水平位置（px；与 A 同位，上下锁芯水平对齐；垂直位置由 PNG 内留白固定为下部）
  background-length: 2 # 背景总格数（每格 = 48px；背景为一张 96x96 整图，故为 2 格）
  tumbler-width: 3        # 机关 A/B 状态图宽度（格，仅 ascii 模式显示宽度；bitmap 模式图标固定 48px）
  max-attempts: 3      # 最大尝试数（超限判撬锁失败）
  move-interval: 6     # A/D 调 A 的步进间隔（tick）
  timeout: 30
  cooldown: 3
  access-duration: 60
  access-once-window: 60
  interrupt-damage: true
  interrupt-move-range: 3.0
