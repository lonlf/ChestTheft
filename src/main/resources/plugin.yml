name: ChestTheft
version: '2.0'
main: com.lonleaf.chesttheft.ChestTheft
api-version: '1.19'
authors: [ lonleaf ]
softdepend: [ MythicMobs, PlaceholderAPI, packetevents, ItemsAdder, MMOItems, Nexo, Oraxen, CraftEngine, NeigeItems, LWC, Bolt, Residence, Dominion, GriefDefender, Towny, WorldGuard, NoBuildPlus]
description: This is a chest theft and lock picking plugin for Minecraft (Spigot).
website: https://github.com/lonlf
commands:
  chesttheft:
    description: ChestTheft 主命令
    usage: /chesttheft give <玩家> <物品ID> [数量] | /chesttheft setitem <物品ID> | /chesttheft check | /chesttheft reload
    aliases: [ ct ]
permissions:
  chesttheft.admin:
    default: op
  chesttheft.protectionOwner:
    description: Treat the holder as the owner of any protected chest (overrides owner checks)
    default: op
  chesttheft.use:
    description: allow to pickup
    default: true
