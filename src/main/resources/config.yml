# 配置文件版本：用于自动升级，低于模板版本时追加新增配置项（勿手动修改）
config-version: 1
# 是否输出调试日志
debug: false
# 保护插件集成设置（与各类保护插件交互）
protection:
  # 受保护插件保护的箱子是否启用本插件撬锁功能
  # false（默认）：不可对受保护箱子上锁，若箱子已有锁则在保护所有者交互时自动卸锁并返还锁物品
  # true：其他玩家可以通过撬锁打开受保护的箱子
  picking-enabled: false
# 语言设置: zh_cn / en_gb
language: "en_gb"
# 数据库设置
database:
  type: sqlite # sqlite / mysql
  # 以下为 MySQL 连接参数（type: mysql 时生效）
  ip: localhost
  port: 3306
  database: minecraft
  user: root
  password: 123456
  usessl: false
  timezone: UTC

# 撬锁小游戏参数
game:
  # 小游戏类型（决定玩法）：moving-bar = 移动游标停在未完成判定区；扩展玩法由插件注册后在 game-type 指定
  game-type: moving-bar
  # --- 公共参数（所有玩法通用，moving-bar 与 rhythm-bar 共用） ---
  timeout: 15        # 超时时间（秒）
  cooldown: 3        # 撬锁结束后的冷却时间（秒）
  access-duration: 60  # 撬锁成功后玩家可自由打开该箱子的时长（秒）；0 表示不启用限时授权，改为仅一次打开机会
  access-once-window: 60  # 一次性打开机会的有效窗口（秒）：access-duration 为 0 时，撬锁成功后需在此窗口内使用这一次打开机会
  interrupt-damage: true    # 撬锁过程中受到伤害时是否中断撬锁
  interrupt-move-range: 3.0  # 撬锁过程中移动超过该范围（方块）时中断撬锁；0 或负值表示不限制移动
  oscillate: true   # 游标是否自动往复移动；false 时改为骑乘模式（玩家进入骑乘状态），按 A/D 键控制游标左右移动
  render-mode: ascii  # 渲染方式: ascii = 字符条（默认，无需材质包）; bitmap = 位图（需玩家安装材质包，见 font 小节）
  bar-length: 15     # 进度条总格数
  unhit-length: 3    # 未完成判定区长度（移动游标玩法：游标进入后点击判定；节奏条玩法：单个判定点长度）
  move-interval: 10  # 光标移动间隔（tick，20 tick = 1 秒）
  # --- rhythm-bar 玩法特有参数（其他玩法不使用）：多个未完成判定点依次命中，全部命中即成功，错过或误点即失败 ---
  hit-count: 3       # 判定点数量
  hit-length: 2      # 每个判定点长度（格数）
  hit-min-gap: 3     # 判定点之间的最小间隔（格数）
  # --- tumbler-bar 玩法特有参数（其他玩法不使用）：A/D 调 A、W 转 B，仅 A 处于可解锁状态时 B 可达最终状态即成功 ---
  a-states: 4          # 机关 A 状态数（每个状态另有对应特殊态，尝试失败时显示）
  initial-a: 0         # 尝试失败复位后 A 的初始状态
  unlock-a: 1          # 可解锁的 A 状态（仅 A 在此状态时 B 能转到最终状态；-1 = 每次撬锁随机选取）
  b-states: 5          # 机关 B 状态数（状态从 0 计）
  b-final: 4           # B 最终状态（达到即成功；默认 b-states-1，配置为其他值会被钳制并告警）
  a-offset: 16         # A 左上角相对背景左端的水平像素位置
  b-offset: 80         # B 左上角相对背景左端的水平像素位置
  background-length: 4 # 背景总长度（格，仅 bitmap 模式使用；ascii 模式条长自动覆盖 A/B 位置）
  max-attempts: 3      # 最大尝试次数（超限判撬锁失败）
  tumbler-width: 3     # 机关 A/B 状态图宽度（格，仅 ascii 模式显示宽度；bitmap 模式图标固定 32px）
  # 说明：move-interval（A/D 调 A 步进）与 render-mode 与上方公共参数共用同一键，等级配置中按需显式指定
  #       tumbler 的 move-interval 代码默认 6（上方公共默认 10 用于 moving-bar/rhythm-bar）
  # --- 音效配置（key: 音效名，支持 "minecraft:命名空间路径" 或 Bukkit 短名如 "note.pling"；
  #      source: 声音类别 master/music/record/weather/block/hostile/neutral/player/ambient/voice；
  #      volume 音量、pitch 音调；key 留空或删除节点即关闭对应音效；等级配置可覆盖单个节点） ---
  sounds:
    # 撬锁成功 / 失败（所有玩法通用）
    success:
      key: "minecraft:block.note_block.pling"
      source: "master"
      volume: 1.0
      pitch: 1.5
    fail:
      key: "minecraft:block.note_block.bass"
      source: "master"
      volume: 1.0
      pitch: 0.8
    # moving-bar / rhythm-bar：游标移动一格（骑乘模式按 A/D 移动同样生效）
    move:
      key: "minecraft:block.note_block.hat"
      source: "master"
      volume: 0.6
      pitch: 1.2
    # moving-bar / rhythm-bar：点击命中判定区/判定点
    hit:
      key: "minecraft:block.note_block.pling"
      source: "master"
      volume: 0.8
      pitch: 1.8
    # tumbler-bar：A 转动（未对准可解锁状态）
    a-move:
      key: "minecraft:block.note_block.hat"
      source: "master"
      volume: 0.6
      pitch: 1.0
    # tumbler-bar：A 转到可解锁状态（特殊提示音）
    a-unlock:
      key: "minecraft:block.note_block.pling"
      source: "master"
      volume: 1.0
      pitch: 2.0
    # tumbler-bar：B 转动
    b-move:
      key: "minecraft:block.note_block.snare"
      source: "master"
      volume: 0.7
      pitch: 1.0

# 上锁方块类型设置（仅允许对以下方块类型上锁，破坏/爆炸清理与卸锁目标判定同此列表）
lock:
  # 允许上锁的方块类型列表；非法项启动时记日志跳过，列表为空时回退默认（箱子和陷阱箱）
  lockable-blocks:
    - CHEST
    - TRAPPED_CHEST
    - acacia_door

# 钥匙功能
key:
  # 是否启用钥匙卸锁功能（已配对钥匙 + 交互按键，卸下锁并返还锁物品；卸锁必须手持钥匙）
  unlock-enabled: true
  # 是否允许非上锁者手持配对钥匙卸锁；false（默认）时仅上锁者本人可卸锁
  unlock-by-holder: false
  # 是否启用钥匙配对功能（未配对钥匙 + 交互按键，由上锁者为钥匙配对）
  pair-enabled: true
  # 交互按键动作: LEFT / RIGHT
  interaction-action: LEFT
  # 交互按键是否必须潜行
  interaction-sneak: true
  # 打开上锁箱子是否必须手持钥匙；false 时背包中有钥匙即可
  require-in-hand: true
  # 手持与箱子配对值匹配的钥匙时，对应箱子粒子提示（粒子效果）
  particle-enabled: true
  # 粒子颜色（颜色名如 GOLD/RED/AQUA，或 #RRGGBB 十六进制）
  particle-color: GOLD
  # 粒子生效半径（方块，玩家与箱子距离在此范围内才播放粒子）
  particle-radius: 8.0
  # 手持与箱子配对值匹配的钥匙时，对应箱子发光提示（发光效果）
  glow-enabled: true
  # 发光颜色（颜色名如 GOLD/RED/AQUA，或 #RRGGBB 十六进制）
  glow-color: GOLD
  # 发光生效半径（方块，玩家与箱子距离在此范围内才发光）
  glow-radius: 8.0

# 掉落战利品箱设置（生物死亡后掉落物装入战利品箱，配置见 lootchest/ 文件夹）
lootchest:
  # 生物死亡是否保持原版掉落（默认开启；设为 false 后生物死亡不再直接掉落物品，而是生成战利品箱）
  vanilla-drop: true
  # 展示方式: display（展示实体，默认，由服务器发包渲染） / block（放置真实箱子方块）
  display-type: display
  # 玩家未拿完战利品时是否保留箱子（保留则之后可再次打开；取空后自动消失，默认开启）
  keep: true
  # 箱子未被开启的过期时间（秒）；0 表示不过期
  expire-time: 600
  # 箱子被开启后的过期时间（秒）；0 表示不过期
  expire-time-opened: 300
  # 与展示实体的交互判定距离（display 模式，方块）
  interaction-range: 4.0
  # 不生成战利品箱的世界名列表
  worlds:
    exclude: []

# 各交互消息显示方式: message（聊天）/ actionbar（动作栏）/ title（标题）
message-format:
  pickingSuccess: title   # 撬锁成功
  pickingFail: title      # 撬锁失败
  pickingStart: title     # 开始撬锁
  pickingCancel: title   # 取消撬锁
  pickingInterrupt: title   # 撬锁被中断（受击/移动超范围）
  lockPicked: actionbar   # 打开已被撬开的锁
  pickingTimeout: title   # 撬锁超时
  pickingCooldown: title  # 撬锁冷却
  lockSuccess: title        # 上锁成功
  blockLocked: actionbar      # 方块已上锁
  lockNotLockable: message  # 方块不可上锁
  unlockSuccess: message    # 卸锁成功
  unlockConfirm: actionbar    # 卸锁确认
  pairSuccess: message      # 配对成功
  pairNotLocker: message    # 无法配对
  keyNotMatched: actionbar    # 钥匙不匹配
  keyChanged: actionbar       # 钥匙已更换
  chestProtected: message    # 受保护箱子已卸锁
  chestProtectedLockDenied: message    # 受保护箱子无法上锁
  chestProtectedAccessDenied: message  # 受保护箱子无法操作
  noPermission: message     # 无权限
  playerOnly: message       # 仅玩家可用
  playerNotFound: message   # 玩家不在线
  invalidId: message        # 无效物品ID
  invalidAmount: message    # 无效数量
  giveSuccess: message      # 给予物品
  setItemSuccess: message   # 设置物品成功
  setItemNoItem: message    # 未手持物品
  checkNotSpecial: message  # 非特殊物品

# 位图渲染（资源包字体）设置：字体名与码位须与生成的资源包一致，非特殊需求勿修改
font:
  # 偏移定位字体（space 类型）：把游标/判定区推进到指定像素位置
  offset: "chesttheft:offset_chars"
  # 游标位图字体（bitmap 类型）：包含底格/未完成格/游标格/空白格/完成格字形
  bar: "chesttheft:bar"
  # 偏移字符码位（十六进制，不带 \u 前缀）：键为像素偏移，值为该偏移对应的码位
  # 与资源包 assets/chesttheft/font/offset_chars.json 中的 advance 定义一一对应
  offset-chars:
    '1': e00a
    '2': e00b
    '4': e00c
    '8': e00d
    '16': e00e
    '32': e00f
    '64': e010
    '128': e011
    '-1': e001
    '-2': e002
    '-4': e003
    '-8': e004
    '-16': e005
    '-32': e006
    '-64': e007
    '-128': e008
  # 位图字符码位（十六进制）：普通格 bar_cell.png（8px/切片）+ 边框格 bar_edge.png（10px/切片，多 1px 边框像素）
  bar-chars:
    base: e100      # 底格（进度条背景，8px）
    unhit: e101     # 未完成格（红色，判定点未命中，8px）
    cursor: e102    # 游标格（黄色，当前游标，8px）
    blank: e103     # 空白格（全透明占位，8px）
    done: e106      # 完成格（绿色，判定点已命中，8px）
    left: e104      # 左端边框格（9px，条最左色块）
    right: e105     # 右端边框格（9px，条最右色块）
  # 机关转轮玩法（tumbler-bar）状态码位：背景块 / A 普通态 / A 特殊态（尝试失败时显示）/ B 状态
  # 新增状态：在下方对应小节追加数字键即可（如 a 加 4: e128），同时修改 lock.yml 对应等级的状态数，无需改代码
  tumbler-chars:
    background: e140  # 背景整图（96x96，单字符，无拼接缝隙；A/B 图标在其上定位；多块用逗号分隔）
    a:
      0: e120       # 机关 A 状态 0
      1: e121       # 机关 A 状态 1
      2: e122       # 机关 A 状态 2
      3: e123       # 机关 A 状态 3
      4: e124       # 机关 A 状态 4
    a-special:
      0: e125       # 机关 A 状态 0 特殊态（tumbler_a_special.png，与普通态分属不同字形）
      1: e126       # 机关 A 状态 1 特殊态
      2: e127       # 机关 A 状态 2 特殊态
      3: e128       # 机关 A 状态 3 特殊态
      4: e129       # 机关 A 状态 4 特殊态
    b:
      0: e130       # 机关 B 状态 0
      1: e131       # 机关 B 状态 1
      2: e132       # 机关 B 状态 2
      3: e133       # 机关 B 状态 3
      4: e134       # 机关 B 状态 4
  # 位图计算参数（须与资源包一致，用于计算渲染间隙补偿偏移）
  # 缩放比例 = height / png 高度；补偿量 = advance(上取整) + glyph-gap - 渲染宽(下取整)
  # 建议 height 与 PNG 高度一致（1:1 不缩放），避免缩放取整导致端点重叠闪动
  bitmap:
    cell-png-height: 8     # bar_cell.png 高度（像素）
    cell-slice-width: 8    # bar_cell 每字符切片宽度（像素）
    cell-height: 8         # bar.json 中 bar_cell provider 的 height（渲染高度，像素）
    edge-png-height: 8     # bar_edge.png 高度（像素）
    edge-slice-width: 9    # bar_edge 每字符切片宽度（像素，比普通格宽 1px 形成边框）
    edge-height: 8         # bar.json 中 bar_edge provider 的 height（渲染高度，像素）
    glyph-gap: 1           # 客户端每字形后固定间隙（像素）
    edge-overlay-outset: 1 # 游标到达端点时，边框格外侧露出的边框像素（边框切片比游标宽时，如边框 15px/游标 8px 设 3）
    tumbler-tile: 48       # 机关转轮（tumbler-bar）背景格/A/B 图标尺寸（像素，48x48 方块；须与资源包 tumbler_bg/tumbler_a/tumbler_a_special/tumbler_b 一致）
    tumbler-png-height: 96 # tumbler 相关 PNG 高度（像素，须与资源包 PNG 高度一致）
    tumbler-height: 96     # bar.json 中 tumbler provider 的 height（渲染高度，像素）
    # tumbler 条整体上下位置：以材质包 bar.json 为准.
    # 服务端仅读取该值用于计算/诊断；调整高度请直接改 bar.json 的 tumbler provider ascent（调大条下移、调小条上移，须 <= height）
    tumbler-ascent: 64
    # 位图条整体水平平移（像素，正=右移、负=左移）：纯服务端渲染偏移，/reload 即生效，无需材质包
    # 垂直方向无法用配置调整：字幕渲染基线由客户端引擎硬编码，像素级垂直偏移只能改材质包 bar.json 的 ascent（见上）
    horizontal-offset: 0
