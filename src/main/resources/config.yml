# 配置文件版本：用于自动升级，低于模板版本时追加新增配置项（勿手动修改）
config-version: 6
# 外部保护插件集成设置（与 LWC / Bolt 等保护插件交互）
protection:
  # 受 LWC / Bolt 保护的箱子是否启用本插件撬锁功能
  # false（默认）：不可对受保护箱子上锁，若箱子已有锁则在保护所有者交互时自动卸锁并返还锁物品
  # true：其他玩家可以通过撬锁打开受保护的箱子
  picking-enabled: false
# 是否输出调试日志
debug: false
# 语言设置: zh_cn / en_gb（首次启动时按服务器地区自动检测填充，可手动修改）
language: "en_gb"
# 数据库设置
database:
  type: sqlite # sqlite / mysql
  # 以下为 MySQL 连接参数（type: mysql 时生效）
  ip: localhost
  port: 3306
  database: minecraft
  user: root
  password: 123456
  usessl: false
  timezone: UTC

# 撬锁小游戏参数
game:
  bar-length: 15     # 进度条总格数
  red-length: 3      # 红色区域长度
  move-interval: 10  # 光标移动间隔（tick，20 tick = 1 秒）
  timeout: 15        # 超时时间（秒）
  cooldown: 3        # 撬锁结束后的冷却时间（秒）
  access-duration: 60  # 撬锁成功后玩家可自由打开该箱子的时长（秒）；0 表示不启用限时授权，改为仅一次打开机会
  access-once-window: 60  # 一次性打开机会的有效窗口（秒）：access-duration 为 0 时，撬锁成功后需在此窗口内使用这一次打开机会
  interrupt-damage: true    # 撬锁过程中受到伤害时是否中断撬锁
  interrupt-move-range: 3.0  # 撬锁过程中移动超过该范围（方块）时中断撬锁；0 或负值表示不限制移动

# 钥匙功能
key:
  # 是否启用钥匙卸锁功能（已配对钥匙 + 交互按键，卸下锁并返还锁物品；卸锁必须手持钥匙）
  unlock-enabled: true
  # 是否启用钥匙配对功能（未配对钥匙 + 交互按键，由上锁者为钥匙配对）
  pair-enabled: true
  # 交互按键动作: LEFT / RIGHT
  interaction-action: LEFT
  # 交互按键是否必须潜行
  interaction-sneak: true
  # 打开上锁箱子是否必须手持钥匙；false 时背包中有钥匙即可
  require-in-hand: true
  # 手持与箱子配对值匹配的钥匙时，对应箱子粒子提示（粒子效果）
  particle-enabled: true
  # 粒子颜色（颜色名如 GOLD/RED/AQUA，或 #RRGGBB 十六进制）
  particle-color: GOLD
  # 粒子生效半径（方块，玩家与箱子距离在此范围内才播放粒子）
  particle-radius: 8.0
  # 手持与箱子配对值匹配的钥匙时，对应箱子发光提示（发光效果）
  glow-enabled: true
  # 发光颜色（颜色名如 GOLD/RED/AQUA，或 #RRGGBB 十六进制）
  glow-color: GOLD
  # 发光生效半径（方块，玩家与箱子距离在此范围内才发光）
  glow-radius: 8.0

# 掉落战利品箱设置（生物死亡后掉落物装入战利品箱，配置见 lootchest/ 文件夹）
lootchest:
  # 生物死亡是否保持原版掉落（默认开启；设为 false 后生物死亡不再直接掉落物品，而是生成战利品箱）
  vanilla-drop: true
  # 展示方式: display（展示实体，默认，由服务器发包渲染） / block（放置真实箱子方块）
  display-type: display
  # 玩家未拿完战利品时是否保留箱子（保留则之后可再次打开；取空后自动消失，默认开启）
  keep: true
  # 箱子未被开启的过期时间（秒）；0 表示不过期
  expire-time: 600
  # 箱子被开启后的过期时间（秒）；0 表示不过期
  expire-time-opened: 300
  # 与展示实体的交互判定距离（display 模式，方块）
  interaction-range: 4.0
  # 不生成战利品箱的世界名列表
  worlds:
    exclude: []

# 各交互消息显示方式: message（聊天）/ actionbar（动作栏）/ title（标题）
message-format:
  pickingSuccess: title   # 撬锁成功
  pickingFail: title      # 撬锁失败
  pickingStart: title     # 开始撬锁
  pickingCancel: title   # 取消撬锁
  pickingInterrupt: title   # 撬锁被中断（受击/移动超范围）
  pickingTimeout: title   # 撬锁超时
  pickingCooldown: title  # 撬锁冷却
  lockSuccess: title        # 上锁成功
  chestLocked: message      # 箱子已上锁
  unlockSuccess: message    # 卸锁成功
  unlockConfirm: message    # 卸锁确认
  pairSuccess: message      # 配对成功
  pairNotLocker: message    # 无法配对
  keyNotMatched: message    # 钥匙不匹配
  keyChanged: message       # 钥匙已更换
  chestProtected: message    # 受保护箱子已卸锁
  chestProtectedLockDenied: message    # 受保护箱子无法上锁
  chestProtectedAccessDenied: message  # 受保护箱子无法操作
  noPermission: message     # 无权限
  playerOnly: message       # 仅玩家可用
  playerNotFound: message   # 玩家不在线
  invalidId: message        # 无效物品ID
  invalidAmount: message    # 无效数量
  giveSuccess: message      # 给予物品
  setItemSuccess: message   # 设置物品成功
  setItemNoItem: message    # 未手持物品
  checkNotSpecial: message  # 非特殊物品
